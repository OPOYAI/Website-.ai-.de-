<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPOY</title>
  <meta name="description" content="OPOY – hier entsteht etwas Neues.">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="OPOY">
  <meta property="og:description" content="Hier entsteht etwas Neues.">
  <meta property="og:image" content="logo.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f6f5f2;
      --fg: #111111;
      --muted: #77756f;
      --line: #dddad3;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f0f0f; --fg: #f2f1ee; --muted: #8d8b85; --line: #2a2a28; }
      .logo { filter: invert(1); }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2rem, 6vh, 4rem);
      padding: 4rem 1.5rem 2rem;
      text-align: center;
    }
    .logo {
      width: min(78vw, 720px);
      height: auto;
      opacity: 0;
      transform: translateY(12px);
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .15s forwards;
    }
    .tagline {
      font-size: clamp(.8rem, 1.4vw, .95rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fade 1s ease 1s forwards;
    }
    footer {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.5rem;
      border-top: 1px solid var(--line);
      font-size: .8rem;
      color: var(--muted);
    }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--fg); }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .logo, .tagline { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="OPOY" width="988" height="263">
    <p class="tagline">Hier entsteht etwas Neues</p>
  </main>
  <footer>
    <span>&copy; <span id="y">2026</span> OPOY</span>
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
